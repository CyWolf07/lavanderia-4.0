plugins { id 'com.android.application' }

android {
    namespace 'co.lavanderia.exclusiva'
    compileSdk 35
    defaultConfig {
        applicationId 'co.lavanderia.exclusiva'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PUNTUAL_KEYSTORE') ?: '../signing/puntual.jks')
            storePassword System.getenv('PUNTUAL_STORE_PASSWORD')
            keyAlias 'puntual'
            keyPassword System.getenv('PUNTUAL_STORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    sourceSets.main.res.srcDir 'src/main/generated-res'
}

tasks.register('copyBrandIcon', Copy) {
    from '../../public/images/logo-lavanderia-exclusiva.png'
    into 'src/main/generated-res/drawable'
    rename { 'brand_logo.png' }
}
tasks.named('preBuild').configure { dependsOn 'copyBrandIcon' }

dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
